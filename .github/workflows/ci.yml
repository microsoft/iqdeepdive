name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: az bicep install
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: >-
          uv run python -m compileall -q
          infra
          src/agent-foundryiq-mcp
          src/agent-foundryiq-api
          src/agent-toolbox-foundryiq
          src/agent-toolbox-foundryiq-workiq
          src/agent-toolbox-workiq
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
