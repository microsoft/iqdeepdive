name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: az bicep install
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: >-
          uv run python -m compileall -q
          infra
          src/agent-foundryiq-mcp
          src/agent-foundryiq-api
          src/agent-toolbox-foundryiq
          src/agent-toolbox-foundryiq-workiq
          src/agent-toolbox-workiq
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
